; PlatformIO project: ESP-NOW Sender (รีโมทจอยสติ๊ก)
; หมายเหตุ: platform = espressif32 (official) ใช้ Arduino-ESP32 core 2.x
; โค้ดรองรับ core 3.x ด้วย ถ้าต้องการ core 3.x ให้ใช้ platform ของ pioarduino แทน

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
